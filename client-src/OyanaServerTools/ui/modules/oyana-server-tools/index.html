<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Oyana Server Tools</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="ost-shell">
      <div class="ost-header">Oyana Server Tools</div>
      <div class="ost-subtitle">Countdown vertical slice ready</div>
      <div id="countdown" class="countdown hidden">
        <div id="countdown-label" class="countdown-label">Race Start</div>
        <div id="countdown-value" class="countdown-value">5</div>
        <div id="countdown-status" class="countdown-status">Waiting for server event</div>
      </div>
      <div id="feature-list" class="feature-list"></div>
    </div>
    <script src="./app.js"></script>
  </body>
</html>
